  <!-- Spaced Repetition Box -->
  <rect x="56" y="558" width="332" height="186" rx="12" fill="#090D16" stroke="#1E293B"/>
  <text x="74" y="586" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">SPACED-REPETITION REVISION ENGINE</text>
  <text x="74" y="614" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Due Today: 4 High-Yield Problems</text>
  <text x="74" y="642" fill="#94A3B8" font-family="monospace" font-size="12">• [Hard] Alien Dictionary (Topo Sort + Cycle)</text>
  <text x="74" y="666" fill="#94A3B8" font-family="monospace" font-size="12">• [Hard] Minimum Window Substring (2-Ptr)</text>
  <text x="74" y="690" fill="#94A3B8" font-family="monospace" font-size="12">• [Med]  LRU Cache Concurrency Lock</text>
  <text x="74" y="714" fill="#34D399" font-family="monospace" font-size="12">✓ Retention Score: 94.6% (+12% vs baseline)</text>

  <!-- Center/Right: Interactive Code + Conversational AI Socratic Coach -->
  <rect x="436" y="92" width="812" height="330" rx="16" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="464" y="126" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">LIVE WORKSPACE · AST &amp; COMPLEXITY ANALYZER</text>
  <rect x="1020" y="106" width="200" height="28" rx="14" fill="#065F46" fill-opacity="0.4" stroke="#34D399"/>
  <text x="1038" y="124" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">Time: O(V + E) · Space: O(V)</text>

  <rect x="464" y="144" width="756" height="254" rx="10" fill="#050811" stroke="#1E293B"/>
  <text x="484" y="174" fill="#818CF8" font-family="monospace" font-size="13">def</text>
  <text x="516" y="174" fill="#38BDF8" font-family="monospace" font-size="13">maxPathTreeDP</text>
  <text x="628" y="174" fill="#E2E8F0" font-family="monospace" font-size="13">(adj: dict[int, list[int]], weights: list[int]) -&gt; int:</text>
  <text x="504" y="200" fill="#64748B" font-family="monospace" font-size="13"># Step 1: Post-order DFS computing best downward branch per subtree</text>
  <text x="504" y="224" fill="#E2E8F0" font-family="monospace" font-size="13">dp_down = [0] * len(weights)</text>
  <text x="504" y="248" fill="#E2E8F0" font-family="monospace" font-size="13">best_diameter = 0</text>
  <text x="504" y="272" fill="#C084FC" font-family="monospace" font-size="13">def</text>
  <text x="536" y="272" fill="#38BDF8" font-family="monospace" font-size="13">dfs</text>
  <text x="564" y="272" fill="#E2E8F0" font-family="monospace" font-size="13">(u: int, parent: int) -&gt; int:</text>
  <text x="536" y="296" fill="#E2E8F0" font-family="monospace" font-size="13">nonlocal best_diameter</text>
  <text x="536" y="320" fill="#E2E8F0" font-family="monospace" font-size="13">top1, top2 = 0, 0</text>
  <text x="536" y="344" fill="#E2E8F0" font-family="monospace" font-size="13">for v in adj[u]:</text>
  <text x="568" y="368" fill="#34D399" font-family="monospace" font-size="13">if v != parent: top1, top2 = update_two_largest(top1, top2, dfs(v, u))</text>

  <!-- Conversational AI Socratic Coach Panel -->
  <rect x="436" y="442" width="812" height="326" rx="16" fill="url(#card)" stroke="#818CF8" stroke-width="1.5"/>
  <text x="464" y="476" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">ALGOATLAS CONVERSATIONAL AI · SOCRATIC CODE MENTOR</text>
  <rect x="1050" y="456" width="170" height="26" rx="13" fill="#312E81" stroke="#818CF8"/>
  <text x="1068" y="473" fill="#C7D2FE" font-family="monospace" font-size="11" font-weight="700">Context-Grounded RAG</text>

  <!-- Chat Messages -->
  <rect x="464" y="494" width="520" height="58" rx="10" fill="#1E293B"/>
  <text x="484" y="518" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Engineer Prompt</text>
  <text x="484" y="538" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13">"How do I avoid O(N²) recomputation when shifting the root across all N nodes?"</text>

  <rect x="464" y="566" width="756" height="128" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="1"/>
  <text x="484" y="592" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AlgoAtlas AI Tutor (Socratic Stage 2 · Complexity &amp; Invariant Hint)</text>
  <text x="484" y="616" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">Notice that your first DFS already computed top1 and top2 downward paths for every node u.</text>
  <text x="484" y="638" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">When you transition the root from u → v, only two subtrees change orientation: u loses v's branch,</text>
  <text x="484" y="660" fill="#34D399" font-family="monospace" font-size="12">→ Try passing up_contrib = weights[u] + (top2 if dfs(v) == top1 else top1) into a second pre-order DFS!</text>

  <!-- Action Chips -->
  <rect x="464" y="708" width="175" height="36" rx="18" fill="#1E293B" stroke="#38BDF8"/>
  <text x="488" y="730" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Verify Rerooting Invariant</text>
  <rect x="652" y="708" width="185" height="36" rx="18" fill="#1E293B" stroke="#818CF8"/>
  <text x="676" y="730" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Simulate Edge Cases</text>
  <rect x="850" y="708" width="210" height="36" rx="18" fill="#1E293B" stroke="#34D399"/>
  <text x="874" y="730" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Add to Spaced Revision Deck</text>
</svg>