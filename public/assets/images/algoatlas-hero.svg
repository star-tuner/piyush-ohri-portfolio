  <text x="66" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">AlgoAtlas</text>
  <rect x="175" y="20" width="145" height="24" rx="12" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="190" y="36" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">CONVERSATIONAL AI</text>
  <text x="880" y="37" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Pattern Graph</text>
  <text x="995" y="37" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Revision Queue</text>
  <rect x="1120" y="18" width="120" height="30" rx="8" fill="url(#accent)"/>
  <text x="1142" y="37" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AI Co-Pilot</text>

  <!-- Left Problem Explorer & Pattern Taxonomy -->
  <rect x="32" y="92" width="380" height="676" rx="16" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="56" y="128" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">ALGORITHMIC PATTERN TAXONOMY</text>
  <text x="56" y="156" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Problem Search &amp; Mastery</text>
  <rect x="56" y="174" width="332" height="38" rx="8" fill="#090D16" stroke="#334155"/>
  <text x="74" y="198" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Search patterns: DP, Monotonic Stack, Graphs...</text>

  <!-- Pattern Cards -->
  <rect x="56" y="230" width="332" height="92" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="74" y="256" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1. Dynamic Programming on Trees &amp; DAGs</text>
  <text x="74" y="278" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">State transitions, rerooting technique &amp; bitmask memo</text>
  <rect x="74" y="292" width="210" height="8" rx="4" fill="#1E293B"/>
  <rect x="74" y="292" width="184" height="8" rx="4" fill="#38BDF8"/>
  <text x="298" y="300" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">88% Mastered</text>

  <rect x="56" y="338" width="332" height="92" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="364" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. Shortest Paths &amp; 0-1 BFS / Dijkstra</text>
  <text x="74" y="386" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">State-space graphs, multi-source relaxation</text>
  <rect x="74" y="400" width="210" height="8" rx="4" fill="#1E293B"/>
  <rect x="74" y="400" width="160" height="8" rx="4" fill="#818CF8"/>
  <text x="298" y="408" fill="#818CF8" font-family="monospace" font-size="12" font-weight="700">76% Mastered</text>

  <rect x="56" y="446" width="332" height="92" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="472" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. Monotonic Queue &amp; Sliding Window</text>
  <text x="74" y="494" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">O(N) amortized range extrema &amp; prefix invariants</text>
  <rect x="74" y="508" width="210" height="8" rx="4" fill="#1E293B"/>
  <rect x="74" y="508" width="195" height="8" rx="4" fill="#34D399"/>
